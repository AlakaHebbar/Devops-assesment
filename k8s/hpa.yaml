# Needs metrics-server (k8s/platform/metrics-server.yaml).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: next-bff-service
  labels:
    app: next-bff-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: next-bff-service
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
