apiVersion: apps/v1
kind: Deployment
metadata:
  name: next-bff-service
  labels:
    app: next-bff-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: next-bff-service
  template:
    metadata:
      labels:
        app: next-bff-service
    spec:
      containers:
        - name: next-bff-service
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/next-bff-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
