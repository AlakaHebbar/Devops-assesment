# CPU and memory metrics for the service's HorizontalPodAutoscaler.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: metrics-server
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # Without this, generated Applications get a resources finalizer: deleting
  # this ApplicationSet (or the cluster no longer matching the generator) would
  # delete everything it deployed. Removal must never take production down.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            environment: prod
  template:
    metadata:
      name: metrics-server
    spec:
      project: platform
      source:
        repoURL: https://kubernetes-sigs.github.io/metrics-server
        chart: metrics-server
        targetRevision: 3.13.0
        helm:
          valuesObject:
            replicas: 2
            podDisruptionBudget:
              enabled: true
              minAvailable: 1
      destination:
        server: '{{ .server }}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
