# Writes the Route 53 alias record for the service's Ingress hostname.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-dns
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            environment: prod
  template:
    metadata:
      name: external-dns
    spec:
      project: platform
      source:
        repoURL: https://kubernetes-sigs.github.io/external-dns
        chart: external-dns
        targetRevision: 1.22.0
        helm:
          valuesObject:
            provider:
              name: aws
            sources: ["ingress"]
            policy: upsert-only
            registry: txt
            txtOwnerId: '{{ .metadata.annotations.cluster_name }}'
            extraArgs:
              - '--zone-id-filter={{ .metadata.annotations.hosted_zone_id }}'
            env:
              - name: AWS_DEFAULT_REGION
                value: '{{ .metadata.annotations.aws_region }}'
            serviceAccount:
              create: true
              name: external-dns
      destination:
        server: '{{ .server }}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
