# Ships container logs to the S3 log archive. Its IAM role (s3:PutObject under
# eks/* in the log bucket) is bound to logging/fluent-bit with EKS Pod Identity.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # Without this, generated Applications get a resources finalizer: deleting
  # this ApplicationSet (or the cluster no longer matching the generator) would
  # delete everything it deployed. Removal must never take production down.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            environment: prod
  template:
    metadata:
      name: fluent-bit
    spec:
      project: platform
      source:
        repoURL: https://fluent.github.io/helm-charts
        chart: fluent-bit
        targetRevision: 0.58.0
        helm:
          valuesObject:
            serviceAccount:
              create: true
              name: fluent-bit
            tolerations:
              - operator: Exists
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            config:
              # Filesystem buffering on the node so logs survive pod restarts and S3 outages.
              service: |
                [SERVICE]
                    Daemon                    Off
                    Flush                     5
                    Log_Level                 info
                    Parsers_File              /fluent-bit/etc/parsers.conf
                    HTTP_Server               On
                    HTTP_Listen               0.0.0.0
                    HTTP_Port                 2020
                    Health_Check              On
                    storage.path              /var/log/flb-storage/
                    storage.sync              normal
                    storage.backlog.mem_limit 16M
              inputs: |
                [INPUT]
                    Name              tail
                    Tag               kube.*
                    Path              /var/log/containers/*.log
                    Exclude_Path      /var/log/containers/fluent-bit-*.log
                    multiline.parser  cri
                    DB                /var/log/flb_kube.db
                    Mem_Buf_Limit     32MB
                    Skip_Long_Lines   On
                    storage.type      filesystem
              filters: |
                [FILTER]
                    Name                kubernetes
                    Match               kube.*
                    Merge_Log           On
                    Keep_Log            Off
                    K8S-Logging.Exclude On
              outputs: |
                [OUTPUT]
                    Name                     s3
                    Match                    kube.*
                    bucket                   {{ .metadata.annotations.log_bucket_name }}
                    region                   {{ .metadata.annotations.aws_region }}
                    s3_key_format            /eks/{{ .metadata.annotations.cluster_name }}/%Y/%m/%d/%H/$TAG[4]-%M%S-$UUID.gz
                    total_file_size          50M
                    upload_timeout           5m
                    use_put_object           On
                    compression              gzip
                    store_dir                /var/log/flb-s3
                    Retry_Limit              False
      destination:
        server: '{{ .server }}'
        namespace: logging
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
