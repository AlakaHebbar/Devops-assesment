# Provisioned by the AWS Load Balancer Controller (infra/platform). The
# environment-specific values (hostname, ACM certificate ARN, WAF web ACL ARN)
# are not committed here: the Argo CD Application in infra/platform patches
# them in from the core stack outputs. external-dns then creates the Route 53
# alias for the host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: next-bff-service
  labels:
    app: next-bff-service
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      deletion_protection.enabled=true,routing.http.drop_invalid_header_fields.enabled=true,idle_timeout.timeout_seconds=60
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: next-bff-service
                port:
                  number: 3000
